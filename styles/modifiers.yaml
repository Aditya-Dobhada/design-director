version: 1
description: "Orthogonal Modifiers and Motion specifications for Design Director"

# ─── Modifier Dimensions ──────────────────────────────────────────────────────
# Five independent axes that compose over any foundation style without altering
# its color, typography, or visual signature.
#
# 1. surface   — Texture and translucency overlays on panel/card surfaces.
# 2. imagery   — Art-direction treatment applied to all product photography and illustration.
# 3. typography — Accent typeface substitutions for specific UI roles (metrics, headings, annotations).
# 4. motion    — Global transition timing and easing character.
# 5. density   — Spacing scale, information-per-viewport, and interactive control sizing.
#               Controls how compact or airy the overall layout feels: from ultra-dense
#               terminal-style row packing to ultra-spacious editorial breathing room.
# 6. layout    — Composition-only structural modifiers that change how panels and content
#               are arranged without affecting color, type, or radius rules.

modifiers:
  # ─── Surface Modifiers ───────────────────────────────────────────────────────
  surface:
    - id: frosted-glass
      name: Frosted Glass
      description: "Translucent frosted surfaces with backdrop blur and specular hairlines."
      tokens:
        css:
          --surface-glass-bg: "rgba(255, 255, 255, 0.05)"
          --surface-glass-border: "rgba(255, 255, 255, 0.12)"
          --surface-glass-blur: "12px"
        tailwind:
          backdropBlur:
            DEFAULT: "12px"
            md: "12px"
            lg: "16px"
      audit_whitelist:
        tailwind_classes:
          - "backdrop-blur-*"
          - "backdrop-filter"
          - "bg-opacity-*"
          - "bg-white/*"
          - "bg-black/*"
        css_properties:
          - "backdrop-filter"
          - "-webkit-backdrop-filter"

    - id: subtle-grain
      name: Subtle Grain
      description: "Tactile micro-grain noise overlay providing organic analog depth."
      tokens:
        css:
          --surface-grain-opacity: "0.04"
          --surface-grain-blend: "overlay"
      audit_whitelist:
        css_properties:
          - "mix-blend-mode"
          - "filter: url(#noise)"

    - id: crt-scanlines
      name: CRT Scanlines
      description: "Simulated cathode-ray tube horizontal scanline lines and phosphor glow."
      tokens:
        css:
          --surface-scanline-height: "2px"
          --surface-scanline-opacity: "0.03"
      audit_whitelist:
        css_properties:
          - "repeating-linear-gradient"

    - id: fine-paper
      name: Fine Paper
      description: "Subtle cotton and linen fiber texture for editorial and craft foundations."
      tokens:
        css:
          --surface-paper-texture: "rgba(0, 0, 0, 0.02)"
      audit_whitelist:
        css_properties:
          - "background-blend-mode"

    - id: chrome-specular
      name: Chrome Specular
      description: "Luminous metallic specular highlight gradients along top and left borders."
      tokens:
        css:
          --border-specular-gradient: "linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 100%)"
      audit_whitelist:
        css_properties:
          - "border-image"

  # ─── Imagery Modifiers ───────────────────────────────────────────────────────
  imagery:
    - id: editorial
      name: Editorial Photography
      description: "High-contrast, art-directed photography with deep shadows and architectural lighting."
      guidelines:
        aspect_ratios: ["3:4", "16:9", "1:1"]
        color_treatment: "desaturated or high-contrast duotone"

    - id: technical
      name: Technical Schematics
      description: "Monochromatic isometric wireframes, architectural blueprints, and circuit traces."
      guidelines:
        stroke_width: "1px"
        style: "orthographic or isometric vector SVG"

    - id: photographic
      name: Authentic Documentary
      description: "Natural daylight, documentary realism, candid perspective without heavy post-processing."

    - id: collage
      name: Mixed-Media Collage
      description: "Torn paper textures, archival stamps, photo cutouts, and layered mixed media."

    - id: pixel
      name: Pixel Art
      description: "Crisp non-anti-aliased 8-bit and 16-bit pixel illustrations."
      guidelines:
        rendering: "image-rendering: pixelated"

    - id: hand-drawn
      name: Hand-Drawn Linework
      description: "Imperfect ink brush, graphite pencil strokes, and artisanal sketches."

  # ─── Typography Modifiers ───────────────────────────────────────────────────
  typography:
    - id: monospace
      name: Monospace Accent
      description: "JetBrains Mono or IBM Plex Mono applied strictly to metrics, keys, and tabular data."
      fonts: ["JetBrains Mono", "IBM Plex Mono", "Fira Code"]

    - id: display-serif
      name: Dramatic Display Serif
      description: "High-contrast Bodoni or Playfair serifs applied to monumental hero headings."
      fonts: ["Bodoni Moda", "Playfair Display", "Italian Plate 70"]

    - id: condensed
      name: Ultra-Condensed Sans
      description: "High-impact condensed grotesque fonts for tight editorial display and section badges."
      fonts: ["Bebas Neue", "Oswald", "Anton"]

    - id: handwritten
      name: Handwritten Annotation
      description: "Casual human annotations, editorial underlines, and personal notes."
      fonts: ["Caveat", "Reenie Beanie", "Nanum Pen Script"]

  # ─── Motion Modifiers ───────────────────────────────────────────────────────
  motion:
    - id: micro-snappy
      name: Micro-Snappy
      description: "Instantaneous, high-efficiency transitions calibrated for productivity and developer tools."
      tokens:
        duration_ms: 120
        easing: "cubic-bezier(0.16, 1, 0.3, 1)"
        css:
          --transition-fast: "120ms cubic-bezier(0.16, 1, 0.3, 1)"

    - id: fluid-spring
      name: Fluid Spring
      description: "Smooth, organic physics-based spring curves for consumer and playful products."
      tokens:
        duration_ms: 350
        easing: "cubic-bezier(0.34, 1.56, 0.64, 1)"
        css:
          --transition-spring: "350ms cubic-bezier(0.34, 1.56, 0.64, 1)"

    - id: inert
      name: Inert / Zero Motion
      description: "Zero transitions and zero animations for instant terminal feedback and accessibility."
      tokens:
        duration_ms: 0
        easing: "linear"
        css:
          --transition-none: "0ms"

  # ─── Density Modifiers ───────────────────────────────────────────────────────
  # Controls spacing scale, information-per-viewport, and interactive control sizing.
  # Orthogonal to all other dimensions — compose freely over any foundation.
  density:
    - id: ultra-dense
      name: Ultra-Dense
      description: "Maximum information-per-viewport: 28–32px row heights, 4–8px gaps, 11px labels. Calibrated for terminal emulators, financial grids, and real-time telemetry streams."
      tokens:
        css:
          --density-row-height: "28px"
          --density-gap: "4px"
          --density-padding-cell: "4px 8px"
          --density-font-size-label: "11px"
          --density-font-size-body: "12px"
          --density-control-height: "24px"

    - id: dense
      name: Dense
      description: "High information density: 36px row heights, 8–12px gaps, 12px labels. Suitable for data-heavy dashboards, admin consoles, and developer tooling."
      tokens:
        css:
          --density-row-height: "36px"
          --density-gap: "8px"
          --density-padding-cell: "6px 12px"
          --density-font-size-label: "12px"
          --density-font-size-body: "13px"
          --density-control-height: "28px"

    - id: balanced
      name: Balanced
      description: "Standard SaaS density: 44px row heights, 16px gaps, 13–14px body. Comfortable for mixed-content products with both data and prose."
      tokens:
        css:
          --density-row-height: "44px"
          --density-gap: "16px"
          --density-padding-cell: "12px 16px"
          --density-font-size-label: "13px"
          --density-font-size-body: "14px"
          --density-control-height: "36px"

    - id: spacious
      name: Spacious
      description: "Generous editorial breathing room: 56px+ row heights, 24–32px gaps, 15–16px body. For luxury, editorial, wealth, and contemplative consumer experiences."
      tokens:
        css:
          --density-row-height: "56px"
          --density-gap: "24px"
          --density-padding-cell: "16px 24px"
          --density-font-size-label: "14px"
          --density-font-size-body: "15px"
          --density-control-height: "44px"

    - id: ultra-spacious
      name: Ultra-Spacious
      description: "Maximum whitespace: 72px+ row heights, 48px+ section gaps, 16–18px body. Reserved for hero marketing pages, brand narratives, and full-bleed editorial layouts."
      tokens:
        css:
          --density-row-height: "72px"
          --density-gap: "48px"
          --density-padding-cell: "24px 32px"
          --density-font-size-label: "15px"
          --density-font-size-body: "17px"
          --density-control-height: "52px"

  # ─── Layout Modifiers ────────────────────────────────────────────────────────
  # Composition-only structural modifiers. These affect how panels and content are
  # arranged without altering color, typography, radius, or surface rules.
  layout:
    - id: bento-grid
      name: Bento Grid
      description: "Masonry-style irregular card grid with heterogeneous cell sizes (spanning 1–3 columns and 1–2 rows). No independent color/type/radius logic — purely compositional. Pairs with any foundation style."
      guidelines:
        grid_template: "repeat(4, 1fr)"
        cell_spans:
          - "1x1 (standard metric tile)"
          - "2x1 (wide chart card)"
          - "1x2 (tall spotlight card)"
          - "2x2 (hero feature panel)"
        gap: "16px (dense) to 24px (spacious)"
        note: "Do NOT define color, border-radius, or shadow rules here — inherit from the active foundation style."
      audit_whitelist:
        css_properties:
          - "grid-column: span 2"
          - "grid-row: span 2"
          - "grid-template-columns"
          - "grid-template-areas"
